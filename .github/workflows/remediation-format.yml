name: remediation format

on:
  push:
    branches:
      - feat/cross-module-remediation

permissions:
  contents: write

concurrency:
  group: remediation-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-module-remediation
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Format remediation branch
        run: vendor/bin/pint --parallel

      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: normalize remediation branch"
          git push origin HEAD:feat/cross-module-remediation
