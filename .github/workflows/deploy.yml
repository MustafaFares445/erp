name: Deploy dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Only the latest dev commit is releasable. A newer push cancels an obsolete
# queued/in-progress run before it can deploy stale code.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  id-token: write # required to request the OIDC token for AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  APP_DIR: ${{ vars.APP_DIR }}

jobs:
  tests:
    name: Full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
          ini-values: pcov.directory=app
          coverage: pcov

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - run: composer test

  warehouse-acceptance:
    name: Warehouse release acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ierp_acceptance_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ierp_acceptance_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      WAREHOUSE_CONCURRENCY_DB_HOST: 127.0.0.1
      WAREHOUSE_CONCURRENCY_DB_PORT: 3306
      WAREHOUSE_CONCURRENCY_DB_DATABASE: ierp_concurrency_testing
      WAREHOUSE_CONCURRENCY_DB_USERNAME: root
      WAREHOUSE_CONCURRENCY_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - name: Create dedicated concurrency database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            -e "CREATE DATABASE IF NOT EXISTS ierp_concurrency_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Fresh migrate and seed acceptance database
        run: php artisan migrate:fresh --seed --force

      - name: Reconcile seeded canonical inventory
        run: php artisan inventory:lots:reconcile

      - name: Prepare dedicated concurrency schema
        run: php artisan migrate:fresh --database=warehouse_concurrency --force

      - name: Run release lifecycle acceptance
        run: php artisan test tests/Feature/Inventory/InventoryReleaseAcceptanceTest.php --compact

      - name: Run low-level MySQL balance race
        run: php artisan test tests/Feature/Inventory/InventoryBalanceConcurrencyTest.php --compact

      - name: Run canonical reservation and delivery races
        run: php artisan test tests/Feature/Inventory/InventoryOperationConcurrencyTest.php --compact

  deploy:
    name: Deploy to EC2 via SSM
    needs:
      - tests
      - warehouse-acceptance
    runs-on: ubuntu-latest
    environment: dev
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command (SSM Run Command)
        id: send
        run: |
          PARAMETERS=$(jq -n \
            --arg dir "$APP_DIR" \
            --arg sha "$GITHUB_SHA" \
            '{
              workingDirectory: [$dir],
              executionTimeout: ["1800"],
              commands: [
                "set -eu",
                "export HOME=/root",
                ("git config --global --add safe.directory " + $dir),
                "git fetch origin dev",
                ("git reset --hard " + $sha),
                "bash scripts/deploy.sh"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ierp dev deploy ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_ID})" \
            --timeout-seconds 600 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command sent: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        run: |
          COMMAND_ID="${{ steps.send.outputs.command_id }}"
          STATUS="Pending"

          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "::group::Deploy output (stdout)"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
          echo "::endgroup::"

          echo "::group::Deploy output (stderr)"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text
          echo "::endgroup::"

          echo "Final SSM status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
