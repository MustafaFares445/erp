name: Deploy dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Never run two deploys at once; a new push waits for the current deploy to finish.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write # required to request the OIDC token for AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  APP_DIR: ${{ vars.APP_DIR }}

jobs:
  tests:
    name: Feature tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - run: php artisan test --testsuite=Feature --compact

  deploy:
    name: Deploy to EC2 via SSM
    needs: tests
    runs-on: ubuntu-latest
    environment: develop
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command (SSM Run Command)
        id: send
        run: |
          # AWS-RunShellScript executes with /bin/sh, so only POSIX syntax here;
          # the heavy lifting happens in scripts/deploy.sh (bash), pulled with the repo.
          PARAMETERS=$(jq -n \
            --arg dir "$APP_DIR" \
            --arg sha "$GITHUB_SHA" \
            '{
              workingDirectory: [$dir],
              executionTimeout: ["1800"],
              commands: [
                "set -eu",
                "export HOME=/root",
                ("git config --global --add safe.directory " + $dir),
                "git fetch origin dev",
                ("git reset --hard " + $sha),
                "bash scripts/deploy.sh"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ierp dev deploy ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_ID})" \
            --timeout-seconds 600 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command sent: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        run: |
          COMMAND_ID="${{ steps.send.outputs.command_id }}"
          STATUS="Pending"

          # Poll up to 30 minutes, matching the SSM executionTimeout.
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "::group::Deploy output (stdout)"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
          echo "::endgroup::"

          echo "::group::Deploy output (stderr)"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text
          echo "::endgroup::"

          echo "Final SSM status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
