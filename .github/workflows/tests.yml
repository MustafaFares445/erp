name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
          ini-values: memory_limit=-1
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: user-guide/package-lock.json

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
      - run: npm ci --prefix user-guide
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer run test:docs
      - run: composer run test:guide
      - run: composer run test:lint
      - run: composer run test:architecture
      - run: composer run test:types
      - run: composer run test:type-coverage

  tests:
    name: Tests (Shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
          ini-values: memory_limit=-1
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate

      - name: Run behavioral test shard
        # The matrix already parallelizes the suite across eight runners. Pest's
        # nested --parallel workers can return a non-zero master-process status
        # even when every test in a shard passes, so keep each shard sequential.
        run: >-
          php -d memory_limit=2G vendor/bin/pest
          --compact
          --shard=${{ matrix.shard }}/8
          --exclude-group=coverage-only
          --exclude-group=architecture

  coverage:
    name: Coverage (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
          ini-values: memory_limit=-1, pcov.directory=app
          coverage: pcov

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer run test:coverage

  seed-integrity:
    name: Seed integrity (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ierp_seed_integrity
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ierp_seed_integrity
      DB_USERNAME: root
      DB_PASSWORD: root
      IERP_DISPOSABLE_DATABASES: ierp_seed_integrity

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite
          ini-values: memory_limit=-1
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate

      - name: Fresh migrate and seed demo data
        run: php artisan migrate:fresh --seed --force

      - name: Run seeder integrity assertions
        run: php artisan test tests/Feature/DatabaseSeederTest.php --compact

  warehouse-acceptance:
    name: Warehouse release acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ierp_acceptance_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ierp_acceptance_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      WAREHOUSE_CONCURRENCY_DB_HOST: 127.0.0.1
      WAREHOUSE_CONCURRENCY_DB_PORT: 3306
      WAREHOUSE_CONCURRENCY_DB_DATABASE: ierp_concurrency_testing
      WAREHOUSE_CONCURRENCY_DB_USERNAME: ierp_race
      WAREHOUSE_CONCURRENCY_DB_PASSWORD: ierp_race
      IERP_DISPOSABLE_DATABASES: ierp_acceptance_testing,ierp_concurrency_testing

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - name: Create dedicated concurrency database and schema-scoped account
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot <<'SQL'
          CREATE DATABASE IF NOT EXISTS ierp_concurrency_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER 'ierp_race'@'%' IDENTIFIED BY 'ierp_race';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES, CREATE TEMPORARY TABLES, LOCK TABLES, CREATE VIEW, SHOW VIEW, TRIGGER, EXECUTE, CREATE ROUTINE, ALTER ROUTINE ON `ierp\_concurrency\_testing`.* TO 'ierp_race'@'%';
          SQL

      - name: Fresh migrate acceptance database
        run: php artisan migrate:fresh --force

      - name: Reconcile canonical inventory
        run: php artisan inventory:lots:reconcile

      - name: Prepare dedicated concurrency schema
        run: php artisan migrate:fresh --database=warehouse_concurrency --force

      - name: Run release lifecycle acceptance
        run: php artisan test tests/Feature/Inventory/InventoryReleaseAcceptanceTest.php --compact

      - name: Run low-level MySQL balance race
        run: php artisan test tests/Feature/Inventory/InventoryBalanceConcurrencyTest.php --compact

      - name: Run canonical reservation and delivery races
        run: php artisan test tests/Feature/Inventory/InventoryOperationConcurrencyTest.php --compact
