name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
          ini-values: memory_limit=-1
          coverage: none

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer run test:lint
      - run: composer run test:types
      - run: composer run test:type-coverage

  tests:
    name: Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
          ini-values: memory_limit=-1
          coverage: none

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate

      - name: Run behavioral test shard
        run: >-
          php -d memory_limit=2G vendor/bin/pest
          --compact --parallel
          --shard=${{ matrix.shard }}/4

  coverage:
    name: Coverage (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
          ini-values: memory_limit=-1, pcov.directory=app
          coverage: pcov

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer run test:coverage

  crm-acceptance:
    name: CRM WP-2.1 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - name: Run focused CRM static analysis
        run: >-
          vendor/bin/phpstan analyse
          app/Data/Crm
          app/Models/Campaign.php
          app/Models/CampaignRecipient.php
          app/Models/CampaignResponse.php
          app/Models/Interaction.php
          app/Models/Lead.php
          app/Models/LeadStageTransition.php
          app/Services/Crm
          app/Console/Commands/DispatchDueCampaignsCommand.php
          app/Filament/Resources/Campaigns
          app/Filament/Resources/CrmReports
          app/Filament/Resources/Interactions
          app/Filament/Resources/Leads
          app/Filament/Widgets/CrmCampaignPerformance.php
          app/Filament/Widgets/CrmDormantLeads.php
          app/Filament/Widgets/CrmLeadFunnel.php
          app/Filament/Widgets/CrmStatistics.php
          --memory-limit=1G

      - name: Run focused CRM regression suite
        run: >-
          php artisan test
          tests/Feature/Crm
          tests/Feature/Filament/CrmAccessTest.php
          tests/Feature/Filament/CrmAuthorizationTest.php
          tests/Feature/ScheduledCommandsTest.php
          --compact

  seed-integrity:
    name: Seed integrity (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ierp_seed_integrity
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ierp_seed_integrity
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite
          ini-values: memory_limit=-1
          coverage: none

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate

      - name: Fresh migrate and seed demo data
        run: php artisan migrate:fresh --seed --force

      - name: Run seeder integrity assertions
        run: php artisan test tests/Feature/DatabaseSeederTest.php --compact

  warehouse-acceptance:
    name: Warehouse release acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ierp_acceptance_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ierp_acceptance_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      WAREHOUSE_CONCURRENCY_DB_HOST: 127.0.0.1
      WAREHOUSE_CONCURRENCY_DB_PORT: 3306
      WAREHOUSE_CONCURRENCY_DB_DATABASE: ierp_concurrency_testing
      WAREHOUSE_CONCURRENCY_DB_USERNAME: root
      WAREHOUSE_CONCURRENCY_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - name: Create dedicated concurrency database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot             -e "CREATE DATABASE IF NOT EXISTS ierp_concurrency_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Fresh migrate acceptance database
        run: php artisan migrate:fresh --force

      - name: Reconcile canonical inventory
        run: php artisan inventory:lots:reconcile

      - name: Prepare dedicated concurrency schema
        run: php artisan migrate:fresh --database=warehouse_concurrency --force

      - name: Run release lifecycle acceptance
        run: php artisan test tests/Feature/Inventory/InventoryReleaseAcceptanceTest.php --compact

      - name: Run low-level MySQL balance race
        run: php artisan test tests/Feature/Inventory/InventoryBalanceConcurrencyTest.php --compact

      - name: Run canonical reservation and delivery races
        run: php artisan test tests/Feature/Inventory/InventoryOperationConcurrencyTest.php --compact
