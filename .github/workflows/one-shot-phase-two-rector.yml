name: one-shot Phase 2 Rector

on:
  push:
    branches:
      - feat/cross-module-remediation

permissions:
  contents: write

jobs:
  rector:
    if: ${{ !contains(github.event.head_commit.message, '[rector-phase2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-module-remediation

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Apply repository Rector rules
        run: vendor/bin/rector process

      - name: Remove one-shot workflow and commit deterministic refactor
        run: |
          rm .github/workflows/one-shot-phase-two-rector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Rector changes to commit."
            exit 0
          fi
          git commit -m "[rector-phase2] Apply WP-2.10 repository refactors"
          git push origin HEAD:feat/cross-module-remediation
